<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Aryan Patil. I build data pipelines and ML systems that prove their own correctness.">
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Helvetica,Arial,sans-serif}
    .k{font-size:13px;letter-spacing:3px;fill:#59636e;font-weight:500}
    .n{font-size:60px;font-weight:600;fill:#1f2328;letter-spacing:-1.5px}
    .t{font-size:22px;fill:#59636e}
    .a{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
    .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}
    .ln{stroke:#0969da;stroke-width:3;stroke-linecap:round;stroke-dasharray:56;stroke-dashoffset:56;animation:draw .8s .7s ease-out forwards}
    @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion: reduce){.a,.ln{animation:none}.ln{stroke-dashoffset:0}}
  </style>
  <text class="f k a d1" x="0" y="44">DATA ENGINEER  ·  MS DATA SCIENCE, RIT</text>
  <text class="f n a d2" x="-3" y="120">Aryan Patil</text>
  <text class="f t a d3" x="0" y="168">I build data pipelines and ML systems that prove their own correctness.</text>
  <line class="ln" x1="2" y1="206" x2="58" y2="206"/>
</svg>
